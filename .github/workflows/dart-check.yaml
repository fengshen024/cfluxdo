name: Dart 检查

# 每次推 main 与 PR 跑一遍 analyze + 全工作区测试。
# 与本地 `just analyze` / `just test` 走同一套 tool 脚本，不另写一套检查逻辑。
#
# 不在这里编原生库：iOS / Android 的 Rust 产物由各自平台的构建任务负责，
# Dart 侧测试不需要它们（FFI 在测试里全部 mock）。

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: dart-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        # packages/fluxdo_render 是 pub workspace 成员，已在主仓库里（单仓）
        uses: actions/checkout@v7

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
          pub-cache: true

      - name: 解析依赖
        # tool/*.dart 要能被 `dart run` 起来，先要有 package_config
        run: flutter pub get

      - name: 准备生成代码
        # l10n（slang 生成物不入库，analyze 前必须先生成）。
        # `test` 子命令不碰代理证书，CI 上不需要 cargo。
        run: dart run tool/project_prep.dart test

      - name: 解析独立包的依赖
        # devtools_extension 与 fluxdo_render/example 是独立 app，不在 workspace
        # 里（各自的 pubspec 写了 resolution: null），根目录的 pub get 不会给它们
        # 生成 package_config.json。本地开发时在这两个目录里跑过 pub get，CI 上
        # 没有；analyze 会扫到它们，缺配置就报一片 uri_does_not_exist。
        run: |
          for DIR in devtools_extension packages/fluxdo_render/example; do
            echo "==> $DIR"
            (cd "$DIR" && flutter pub get)
          done

      - name: 补代理证书目录
        # pubspec 里声明了 assets/certs/，目录不存在时资产打包会打印
        # 「unable to find directory entry」；CI 不跑 gen_ca（要编译 Rust），
        # 建个空目录即可。测试不读这个证书，只要求目录存在。
        run: mkdir -p assets/certs

      - name: flutter analyze
        # 与 `release:prepare` 的非严格模式一致：infos / warnings 只提示不挡，
        # 报错级问题才失败。
        #
        # 失败时把前几行结果转成 GitHub 注解：默认日志只有仓库 admin 能下载，
        # 注解走公开 API，出问题时不登录也能看到是哪个文件哪一行。
        # 不依赖具体输出格式，原样搬运，避免 analyze 改版后注解静默失效。
        run: |
          # 默认 shell 带 -e，先关掉才能拿到退出码
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 \
            | tee flutter-analyze.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # analyze 会先跑一遍 pub get，前面全是依赖解析的噪音，真正的问题在
            # 「Analyzing ...」之后。找不到该行时退回最后 10 行。
            # 每个 step 最多 10 条注解，`%` 是工作流命令的转义字符，需转义。
            REPORT=$(awk '/^Analyzing /{found=1} found' flutter-analyze.log)
            if [ -z "$REPORT" ]; then
              REPORT=$(tail -n 10 flutter-analyze.log)
            fi
            printf '%s\n' "$REPORT" | grep -v '^[[:space:]]*$' | head -10 | \
              while IFS= read -r line; do
                echo "::error title=flutter analyze::${line//%/%%}"
              done
          fi
          exit "$status"

      - name: flutter test
        # test:all 会按 pub workspace 逐个包跑，含 packages/*/test；
        # 依赖 macOS 的 golden 测试在其它平台自行 skip。
        #
        # 同 analyze：失败时把失败用例名写成注解，日志只有 admin 能下载，
        # 注解走公开 API。
        run: |
          set +e
          dart run tool/project_tasks.dart test:all 2>&1 | tee flutter-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # 测试失败会打印 `[E]` 或 `Some tests failed`，用例名在
            # `test/...dart: line` 那一行；直接抓 test/ 路径最稳
            grep -E '(^|[^a-zA-Z0-9_/])test/.*\.dart' flutter-test.log \
              | sed -E 's/^[[:space:]]*//' | sort -u | head -10 | \
              while IFS= read -r line; do
                echo "::error title=flutter test::${line//%/%%}"
              done
          fi
          exit "$status"
